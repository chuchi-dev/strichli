[package]
name = "strichli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8.9"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.1", features = [
	"compression-gzip",
	"cors",
	"fs",
	"trace",
] }
tokio = { version = "1.54", features = [
	"rt-multi-thread",
	"macros",
	"fs",
	"signal",
	"time",
] }
pg = { package = "chuchi-postgres", version = "0.3.1", features = [
	"crypto-token",
	"json",
] }
crypto = { package = "chuchi-crypto", version = "0.2.0", features = [
	"b64",
	"serde",
	"postgres",
] }
bcrypt = "0.17"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postgres-types = "0.2.14"
sha2 = "0.10"
toml = "1.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
